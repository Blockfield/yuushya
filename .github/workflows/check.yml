name: Recipe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run lint
      - run: mise run format:check
      - run: mise run test
      - run: mise run build
      - run: cd files/mods && sha256sum -c ../../BUILD-SHA256SUMS
